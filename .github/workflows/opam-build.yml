name: Opam Pipeline

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - ubuntu-26.04-arm
          # - windows-latest # for some reason windows build is not picking dune 3.5
        ocaml-compiler:
          - ocaml-variants.5.6.0+trunk

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          path: melange

      - name: Checkout js_of_ocaml with OCaml 5.6 support
        uses: actions/checkout@v7
        with:
          repository: ocsigen/js_of_ocaml
          ref: 8b46f0628091b73513141a010c3ac3914a872395
          path: js_of_ocaml

      - name: Use Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Homebrew dependencies
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          env HOMEBREW_NO_AUTO_UPDATE=1 brew install tree

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          cache-prefix: v3-${{ hashFiles('melange/.github/workflows/opam-build.yml') }}

      - name: Restore OPAM cache
        id: opam-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.opam
            ~/work/melange/melange/_opam
          key: opam-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('melange/.github/workflows/opam-build.yml') }}-${{ hashFiles('melange/*.opam', 'melange/dune-project', 'melange/Makefile') }}
          restore-keys: |
            opam-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('melange/.github/workflows/opam-build.yml') }}-

      - name: Install dependencies
        working-directory: melange
        run: |
          rm -rf ~/.opam/repo/default ~/.opam/repo/default.tar.gz
          opam update
          # Match dune_3 in flake.lock; Git metadata is required by dune subst.
          opam pin add dune.3.25.0~alpha0 git+https://github.com/anmonteiro/dune.git#d244859fa04e4b0156b36cb0cea1995fd051a43d -y --no-action
          opam pin add dune-build-info.3.25.0~alpha0 git+https://github.com/anmonteiro/dune.git#d244859fa04e4b0156b36cb0cea1995fd051a43d -y --no-action
          opam pin add ppxlib https://github.com/ocaml-ppx/ppxlib/archive/377fee7793ee12d82772c619efee7985ea31f53f.tar.gz -y --no-action
          opam pin add reason https://github.com/reasonml/reason/archive/02024f3641892afa2fd26a10e4ad9bf74904cb71.tar.gz -y --no-action
          # Apply ocsigen/js_of_ocaml#2488; keep in sync with flake.nix.
          curl -fsSL \
            https://github.com/ocsigen/js_of_ocaml/compare/b169c0f0b677744d0fa044ac6e1a19f75889ef0a...6d2301902e8919e3a7f5cb81ab579ed2f3b116da.diff \
            | git -C ../js_of_ocaml apply
          # Adapt the PR to OCaml's final hint constructor name.
          sed -i.bak \
            's/Hint_int_array -> Some Hint_int_array/Hint_immediate_result -> Some Hint_int_array/' \
            ../js_of_ocaml/compiler/lib/ocaml_compiler.ml
          rm ../js_of_ocaml/compiler/lib/ocaml_compiler.ml.bak
          opam pin add js_of_ocaml-compiler.dev ../js_of_ocaml --kind=path -y --no-action
          opam pin add js_of_ocaml.dev ../js_of_ocaml --kind=path -y --no-action
          make opam-install-test

      - name: Clone melange-opam-template
        run: |
          git clone --depth 1 https://github.com/melange-re/melange-opam-template.git
          cd melange-opam-template

      - name: Install all deps
        working-directory: melange-opam-template
        run: |
          opam pin add reason-react-ppx.dev git+https://github.com/reasonml/reason-react.git#c97615d62311f32c2dbb1e5d159c06e147ca7545 -y
          opam pin add reason-react.dev git+https://github.com/reasonml/reason-react.git#c97615d62311f32c2dbb1e5d159c06e147ca7545 -y
          npm install

      - name: Build basic template
        working-directory: melange-opam-template
        run: |
          opam exec -- dune build @react @node --profile=release --display=short
          npm run bundle

      - name: Run resulting .js files
        working-directory: melange-opam-template
        run: |
          node ./_build/default/src/node/src/Hello.mjs

      - name: Save OPAM cache
        uses: actions/cache/save@v6
        if: steps.opam-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.opam
            ~/work/melange/melange/_opam
          key: opam-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('melange/.github/workflows/opam-build.yml') }}-${{ hashFiles('melange/*.opam', 'melange/dune-project', 'melange/Makefile') }}
